name: Refresh data

# The app ships a committed snapshot of the season, so it renders instantly with no
# requests — but that snapshot goes stale the moment a game finishes. This keeps it
# current: twice daily it re-fetches, and on any change it tests, commits to main, and
# redeploys the site — all in this one job. The test run is the gate, so a bad refresh
# fails here instead of shipping. Copied from the-nba-schedule (the most recently
# fixed version — auto-publish, coverage gate, per-workflow concurrency; PLAYBOOK §8).
#
# Per-league edits, and nothing else:
#   1. The cron times — schedule the early run AFTER the league's latest possible
#      game ends in UTC (WNBA: 09:15 covers West-coast tips; EPL would want ~23:15).
#      Give each main run a catch-up an hour later (see below).
#   2. The fetch script name. Do NOT pass --season: the script must default to the
#      committed SEASON from src/data/teams.js (PLAYBOOK §8 — a calendar default or a
#      season pinned here re-fetches the archived season the morning after a rollover).
#   3. The diff/commit paths, if the app commits data beyond src/data + public/logos.
#   4. The commit message noun ("schedule, results, and player stats").
#
# ESPN's edge (Akamai) blocks a subset of GitHub's Azure runner IPs intermittently —
# ~1 run in 8 lands on a blocked IP and 403s (WNBA 2026-08-09, 2026-08-16). Retrying
# inside that run is useless: it keeps the same blocked IP (proven 2026-08-16: 5×403
# over 61 min). A fresh run gets a fresh runner, hence a fresh IP, which almost always
# isn't blocked — so each main cron is shadowed by a catch-up an hour later. On a normal
# day the catch-up finds nothing to do and exits in seconds; the `refresh-data`
# concurrency group keeps it from overlapping the main run. A wide, hours-long block
# survives even the catch-up — set the optional ESPN_PROXY variable (an egress that
# isn't a GitHub IP) to route around it; see README "Data refresh".

on:
  schedule:
    - cron: '15 9 * * *' # TODO main: after the league's latest game, in UTC
    - cron: '15 10 * * *' # TODO catch-up on a fresh runner IP, ~1h after the main run
    - cron: '15 19 * * *' # TODO main: afternoon games and schedule changes
    - cron: '15 20 * * *' # TODO catch-up on a fresh runner IP, ~1h after the main run
  workflow_dispatch:

permissions:
  contents: write # commit the refreshed data to main
  pages: write # deploy the rebuilt site
  id-token: write # OIDC for actions/deploy-pages

# The fetch/test phase needs no repo-wide lock — only the Pages deploy must serialize
# with CI's, and that lives as a job-level `pages` group on both deploy jobs. A static
# workflow-level `pages` group here used to occupy the shared slot for the whole
# fetch+gate run and helped cancel main's queued CI (NBA viewer, 2026-08-13).
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # No deps needed to fetch — the script uses Node built-ins only. Season defaults to
      # the committed teams.js SEASON — do NOT pass --season (PLAYBOOK §8).
      #
      # Deliberately no in-run retry loop. A 403 here means this runner's IP is blocked,
      # and every retry on the same runner keeps that same IP — so an in-run loop can only
      # burn the hour and fail anyway (proven 2026-08-16: 5×403 over 61 min). Fresh-IP
      # recovery is the +1h catch-up schedule above. For a wider, hours-long block, set the
      # ESPN_PROXY repo variable (an egress that isn't a GitHub IP — deploy the free Worker
      # and follow the steps in sports-viewer-meta/docs/ESPN-PROXY.md); the fetch script
      # then routes ESPN calls through it and a blocked runner stops mattering entirely.
      - name: Regenerate schedule, players, and logos
        run: node scripts/fetch-schedule.mjs
        env:
          ESPN_PROXY: ${{ vars.ESPN_PROXY }}

      - name: Summarize what changed
        id: diff
        run: |
          if git diff --quiet -- src/data public/logos; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Data refresh"
              echo '```'
              git diff --stat -- src/data public/logos
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The gate: standings are derived from the committed scores, so a bad refresh fails
      # a test here rather than shipping a wrong-looking table. Run the SAME gate as
      # CI (the 100% coverage badge), because this push triggers no CI of its own —
      # a weaker gate here once let refreshed data dry up a covered branch and break
      # the next human push (WNBA raceScenarios, 2026-08-10).
      - name: Install and test against the refreshed data
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm ci
          npm run coverage:badge

      # Commit straight to main (the test above is the gate). This push is authored by
      # GITHUB_TOKEN, so it does NOT trigger the CI deploy — this workflow deploys itself
      # in the job below instead.
      - name: Commit the refreshed data to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- src/data public/logos
          git commit -m "Refresh schedule, results, and player stats from ESPN"
          git push

      - name: Build the site
        if: steps.diff.outputs.changed == 'true'
        run: npm run build

      - name: Upload the Pages artifact
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Publishes the artifact the refresh job built — only when there was a change.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # Serialize Pages deploys across workflows (CI + refresh-data), never mid-cancel.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
